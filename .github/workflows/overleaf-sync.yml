# Sincroniza este repo com o projeto Overleaf nos dois sentidos.
# Requer o secret OVERLEAF_GIT_TOKEN (Overleaf > Account Settings > Git Integration).
name: Overleaf sync

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: overleaf-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar git
        run: |
          git config user.name "overleaf-sync[bot]"
          git config user.email "overleaf-sync@users.noreply.github.com"
          git remote add overleaf "https://git:${{ secrets.OVERLEAF_GIT_TOKEN }}@git.overleaf.com/6af208737e7b09e57e05c8f9"

      - name: Overleaf -> GitHub
        run: |
          git fetch overleaf main
          # shortcut: em conflito o job falha e alguém resolve à mão, automatizar só se virar rotina
          git merge --no-edit overleaf/main
          git push origin HEAD:main

      - name: GitHub -> Overleaf
        run: git push overleaf HEAD:main
